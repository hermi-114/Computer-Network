<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đề ôn tập 04 – MMT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--paper:#fff;--ink:#1d2330;--muted:#5f6878;--line:#e3e0d8;--accent:#1f6f5c;--accent2:#b5562a;--soft:#eef3f0;--ok:#1f8a4c;--okbg:#e7f6ec;--bad:#d23c32;--badbg:#fdecea;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171c;--paper:#1b1f26;--ink:#e6e8ec;--muted:#9aa3b2;--line:#2c323c;--accent:#5cc4a6;--accent2:#e59266;--soft:#20302b;--ok:#4fd18b;--okbg:#173126;--bad:#ff6b61;--badbg:#3a1d1c;--warn:#f0b54a}}
:root[data-theme=dark]{--bg:#14171c;--paper:#1b1f26;--ink:#e6e8ec;--muted:#9aa3b2;--line:#2c323c;--accent:#5cc4a6;--accent2:#e59266;--soft:#20302b;--ok:#4fd18b;--okbg:#173126;--bad:#ff6b61;--badbg:#3a1d1c;--warn:#f0b54a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 "Be Vietnam Pro",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;flex:1;min-width:160px}
.prog{font-size:13px;color:var(--muted)}
.track{height:4px;background:var(--line)} .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .1s,border-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)} .btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:20px 16px 90px}
.result{display:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.result.show{display:block}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--badbg) 0);display:grid;place-items:center;flex:none}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.na{background:var(--soft);color:var(--muted)}
.jump{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.jump a{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
.jump a.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)} .jump a.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 16px;scroll-margin-top:80px;transition:border-color .2s,box-shadow .2s}
.q.ok{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.q.bad{border:2px solid var(--bad);box-shadow:inset 8px 0 0 var(--bad);background:linear-gradient(90deg,var(--badbg),var(--paper) 55%)}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.num{font-weight:700;color:var(--accent)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.lt{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.verdict{margin-left:auto;font-size:13px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.qt{margin:4px 0 12px;font-weight:500;word-break:break-word}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s;word-break:break-word}
.opt:hover{border-color:var(--accent)}
.opt input{display:none}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)} .opt.sel .l{background:var(--accent);border-color:var(--accent);color:#fff}
.done .opt{cursor:default} .done .opt:hover{border-color:var(--line)}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.mono,.opt .t{font-variant-numeric:tabular-nums}
.ex{display:none;margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--soft);border-left:4px solid var(--accent);font-size:14.5px}
.done .ex{display:block}
.q.bad .ex{border-left-color:var(--bad)}
.foot{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.foot-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.onlybad .q.ok{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid} .modal>div{background:var(--paper);border-radius:14px;padding:20px;max-width:380px;border:1px solid var(--line)}
.modal p{margin:0 0 14px} .modal .row{display:flex;gap:8px;justify-content:flex-end}
@media (max-width:560px){.bar h1{font-size:15px}.q{padding:14px}.btn{padding:7px 11px;font-size:13px}}
</style></head><body>
<div class="bar"><div class="bar-in">
<a class="btn" href="../on-tap.html">← Những câu hỏi ôn tập</a>
<h1>Đề ôn tập số 04</h1>
<span class="prog" id="prog">0/20</span>
<button class="btn" id="theme" title="Đổi giao diện">◐</button>
</div><div class="track"><i id="trk"></i></div></div>
<main>
<section class="result" id="result"></section>
<div id="list"></div>
</main>
<div class="foot"><div class="foot-in">
<button class="btn" id="shuffle">⤮ Xáo trộn câu hỏi</button>
<button class="btn" id="filter" hidden>Chỉ xem câu sai</button>
<button class="btn" id="retry" hidden>↺ Làm lại</button>
<button class="btn primary" id="submit">Nộp bài</button>
</div></div>
<div class="modal" id="modal"><div><p id="mtext"></p><div class="row"><button class="btn" id="mno">Làm tiếp</button><button class="btn primary" id="myes">Vẫn nộp</button></div></div></div>
<script>
const EXAM='04';
const Q=[{"q": "Mã hóa chuỗi 000011 bằng NRZI (bit 1 = đổi mức), mức trước đó là H. Dãy mức thu được?", "options": ["L L L L H L", "L L L L H H", "L H L H H H", "H H H H L H"], "correct": 3, "expl": "Bắt đầu từ H: gặp 1 thì lật mức, gặp 0 thì giữ → H H H H L H.", "part": "Tầng vật lý", "topic": "NRZI", "star": true, "kind": "TT"}, {"q": "Bước sóng của tín hiệu thiết bị 433 MHz (433 MHz) xấp xỉ bao nhiêu? (c = 3·10⁸ m/s)", "options": ["6,93 m", "1,39 m", "69,28 cm", "6,93 cm"], "correct": 2, "expl": "λ = c/f = 3·10⁸/433 MHz = 69,28 cm. Mẹo: λ(m)·f(MHz) ≈ 300.", "part": "Tầng vật lý", "topic": "λ·f = c", "star": true, "kind": "TT"}, {"q": "Vệ tinh ở độ cao 35.786 km. Độ trễ lan truyền một chiều từ trạm mặt đất lên vệ tinh rồi xuống trạm khác (tốc độ 300.000 km/s) xấp xỉ?", "options": ["477 ms", "119 ms", "358 ms", "239 ms"], "correct": 3, "expl": "Quãng đường = 2×35.786 km; t = 71.572/300.000 ≈ 239 ms.", "part": "Giới thiệu", "topic": "Trễ lan truyền", "star": true, "kind": "TT"}, {"q": "Thứ tự 4 thông điệp DHCP là?", "options": ["Discover → Request → Offer → ACK", "Discover → Offer → Request → ACK", "Offer → Discover → ACK → Request", "Request → Offer → Discover → ACK"], "correct": 1, "expl": "DORA: client tìm server, server đề nghị, client yêu cầu, server xác nhận.", "part": "Tầng mạng", "topic": "ICMP / DHCP", "star": false, "kind": "LT"}, {"q": "Tách khung bằng byte cờ và chèn byte. Dữ liệu: E ESC B FLAG FLAG B. Sau khi chèn byte (chưa tính FLAG đầu/cuối khung) là?", "options": ["E ESC ESC B FLAG FLAG B", "E ESC ESC B ESC FLAG ESC FLAG B", "E ESC B ESC FLAG ESC FLAG B", "E ESC ESC B FLAG ESC FLAG ESC B"], "correct": 1, "expl": "Chèn ESC trước MỌI byte FLAG và MỌI byte ESC trong dữ liệu.", "part": "Tầng liên kết dữ liệu", "topic": "Chèn byte", "star": true, "kind": "TT"}, {"q": "Vì sao CSMA vẫn có thể xảy ra va chạm?", "options": ["Do khung quá dài", "Do dùng chung địa chỉ MAC", "Do trễ lan truyền: trạm khác chưa nghe thấy tín hiệu đã phát", "Do các trạm không nghe kênh trước khi gửi"], "correct": 2, "expl": "Tín hiệu cần thời gian để lan tới trạm khác; trong khoảng đó trạm kia vẫn thấy kênh rỗi.", "part": "Tầng liên kết dữ liệu", "topic": "Đa truy cập", "star": false, "kind": "LT"}, {"q": "Mạng 128.208.0.0/16 được chia: Toán–Cơ–Tin 128.208.128.0/17, Hóa 128.208.0.0/18, Sinh 128.208.96.0/19 (128.208.64.0/19 trống). Địa chỉ 128.208.101.40 thuộc khối nào?", "options": ["Sinh (128.208.96.0/19)", "Hóa (128.208.0.0/18)", "Toán–Cơ–Tin (128.208.128.0/17)", "khối trống 128.208.64.0/19"], "correct": 0, "expl": "Octet 3 = 101 = 01100101₂ → xét các bit đầu: 1… → /17; 00… → /18; 011… → Sinh; 010… → trống.", "part": "Tầng mạng", "topic": "IP thuộc mạng con nào", "star": true, "kind": "TT"}, {"q": "Nhận được từ mã Hamming 0111010 (7 bit, vị trí đánh số 1 → 7 từ PHẢI sang TRÁI, bit kiểm tra ở vị trí lũy thừa của 2). Bit lỗi ở vị trí nào?", "options": ["3", "4", "5", "6"], "correct": 2, "expl": "XOR các vị trí có bit 1 (6, 5, 4, 2) = 5 → bit thứ 5 bị lỗi.", "part": "Tầng liên kết dữ liệu", "topic": "Sửa lỗi Hamming", "star": true, "kind": "TT"}, {"q": "Mã chập trên slide: b1 = u⊕S1⊕S2, b2 = u⊕S2 (S1, S2 ban đầu = 0; sau mỗi bit S2←S1, S1←u). Mã hóa 0001 kèm thêm 00 cuối được?", "options": ["00 00 00 11 01 11", "00 00 00 11 10 11", "00 00 00 11", "00 00 00 11 11 10"], "correct": 1, "expl": "Tính lần lượt từng bit vào (gồm cả 2 bit 0 đệm) → 00 00 00 11 10 11.", "part": "Tầng liên kết dữ liệu", "topic": "Mã chập", "star": false, "kind": "TT"}, {"q": "Đã phát khung 0 đến 5; khung 1 và khung 4 bị mất. Số khung phải gửi lại với Go-Back-N và Selective Repeat?", "options": ["2 và 2", "5 và 2", "5 và 1", "6 và 2"], "correct": 1, "expl": "GBN gửi lại từ khung mất đầu tiên (1) đến 5: 5; SR gửi lại đúng 2 khung bị mất.", "part": "Tầng liên kết dữ liệu", "topic": "GBN / SR", "star": true, "kind": "TT"}, {"q": "Distance vector tại router J. K: trễ J→K = 14, K báo tới X = 12; E: trễ J→E = 14, E báo tới X = 11; D: trễ J→D = 7, D báo tới X = 18; H: trễ J→H = 8, H báo tới X = 16. Khoảng cách mới từ J tới X và hàng xóm chuyển tiếp là?", "options": ["11, qua E", "25, qua D", "25, qua E", "24, qua H"], "correct": 3, "expl": "D_J(X) = min(trễ tới hàng xóm + khoảng cách hàng xóm báo): 14+12=26, 14+11=25, 7+18=25, 8+16=24 → 24 qua H.", "part": "Tầng mạng", "topic": "Distance vector", "star": true, "kind": "TT"}, {"q": "Bảng định tuyến: 194.28.0.0/16 → R1; 194.28.0.0/19 → R2; 194.28.8.0/22 → R3; 0.0.0.0/0 → R0 (mặc định). Gói có đích 194.28.21.169 được chuyển tới đâu?", "options": ["R2", "R3", "R0 (mặc định)", "R1"], "correct": 0, "expl": "Các mục khớp với 194.28.21.169: /16, /19, /0 → chọn prefix dài nhất (/0) → R2.", "part": "Tầng mạng", "topic": "Longest prefix match", "star": true, "kind": "TT"}, {"q": "Bên nhận HDLC nhận được phần dữ liệu (đã bỏ cờ): 01111101111010111110. Dữ liệu gốc là?", "options": ["01111011111011110", "01111101111010111110", "0111110111101011111", "011111111101011111"], "correct": 3, "expl": "Sau mỗi 5 bit 1 liên tiếp, xóa bit 0 ngay sau đó.", "part": "Tầng liên kết dữ liệu", "topic": "Bỏ chèn bit", "star": true, "kind": "TT"}, {"q": "Differential Manchester: bit 1 có đổi mức ở đầu bit, bit 0 không đổi; luôn đổi ở giữa bit. Mức trước đó là H, tín hiệu thu được: HL LH LH HL. Chuỗi bit là?", "options": ["0110", "0010", "0100", "1101"], "correct": 1, "expl": "So nửa đầu mỗi bit với mức cuối của bit trước (bắt đầu với H): khác → 1, giống → 0 → 0010.", "part": "Tầng vật lý", "topic": "Differential Manchester", "star": true, "kind": "TT"}, {"q": "Kiểu điều chế nào nhạy với nhiễu nhất vì thông tin nằm ở biên độ?", "options": ["FSK (điều tần)", "QPSK", "ASK (điều biên)", "PSK (điều pha)"], "correct": 2, "expl": "Nhiễu/cộng hưởng làm thay đổi biên độ, nên ASK dễ sai nhất.", "part": "Tầng vật lý", "topic": "Điều chế", "star": false, "kind": "LT"}, {"q": "Đồ thị có các cạnh (trọng số): A–B: 7, A–C: 9, A–D: 8, B–D: 5, B–E: 6, C–E: 1, D–E: 3. Dùng Dijkstra, đường ngắn nhất từ A tới E có tổng chi phí là?", "options": ["13 (đường A–B–E)", "11 (đường A–D–E)", "15 (đường A–B–D–E)", "10 (đường A–C–E)"], "correct": 3, "expl": "Chạy Dijkstra từ A, chốt dần nút có khoảng cách nhỏ nhất; khoảng cách tới E = 10 theo A–C–E.", "part": "Tầng mạng", "topic": "Dijkstra", "star": true, "kind": "TT"}, {"q": "Router có 3 cổng, mỗi cổng nối 1 switch 4 cổng (dùng hết, đã gồm cổng nối router), không VLAN. Số miền va chạm và miền quảng bá?", "options": ["12 và 3", "12 và 1", "15 và 3", "3 và 12"], "correct": 0, "expl": "Mỗi cổng switch: 1 miền va chạm → 3×4; mỗi cổng router: 1 miền quảng bá → 3.", "part": "Tầng liên kết dữ liệu", "topic": "Miền va chạm / quảng bá", "star": true, "kind": "TT"}, {"q": "Tầng nào của OSI đảm bảo dữ liệu được biểu diễn chuẩn để các ứng dụng khác ngôn ngữ, hệ điều hành, phần cứng vẫn hiểu đúng?", "options": ["Tầng Phiên (Session)", "Tầng Ứng dụng (Application)", "Tầng Biểu diễn (Presentation)", "Tầng Vận chuyển (Transport)"], "correct": 2, "expl": "Tầng 6 – Biểu diễn – lo cú pháp, mã hóa, biểu diễn dữ liệu chuẩn.", "part": "Giới thiệu", "topic": "OSI", "star": false, "kind": "LT"}, {"q": "Kênh không nhiễu có băng thông 8 MHz, dùng tín hiệu 8 mức. Theo Nyquist, tốc độ dữ liệu tối đa là?", "options": ["48 Mbps", "128 Mbps", "24 Mbps", "96 Mbps"], "correct": 0, "expl": "C = 2·B·log₂V = 2×8 MHz×3 = 48 Mbps.", "part": "Tầng vật lý", "topic": "Nyquist", "star": true, "kind": "TT"}, {"q": "Dạng viết gọn đúng (và ngắn nhất) của địa chỉ IPv6 0000:0000:0000:0000:0000:0000:0502:0000 là?", "options": ["::502:0", "0:0:0:0:0:0:502::", ":0:502:0", "0:0:0:0:0:0:502:0"], "correct": 0, "expl": "Bỏ số 0 đứng đầu mỗi nhóm; thay CHUỖI nhóm 0 dài nhất bằng \"::\" (chỉ một lần).", "part": "Tầng mạng", "topic": "Rút gọn IPv6", "star": true, "kind": "TT"}];
const L='ABCD';
let order=Q.map((_,i)=>i), ans={}, done=false;
const $=s=>document.querySelector(s);
function render(){
  const list=$('#list'); list.innerHTML='';
  order.forEach((qi,pos)=>{const q=Q[qi];
    const card=document.createElement('article'); card.className='q'; card.id='q'+qi;
    const h=document.createElement('div'); h.className='qh';
    const n=document.createElement('span'); n.className='num'; n.textContent='Câu '+(pos+1); h.appendChild(n);
    const t1=document.createElement('span'); t1.className='tag'+(q.kind==='LT'?' lt':''); t1.textContent=q.kind==='LT'?'Lý thuyết':'Tính toán'; h.appendChild(t1);
    const t2=document.createElement('span'); t2.className='tag'; t2.textContent=q.part+' · '+q.topic+(q.star?' ⭐':''); h.appendChild(t2);
    const v=document.createElement('span'); v.className='verdict'; h.appendChild(v);
    card.appendChild(h);
    const qt=document.createElement('div'); qt.className='qt'; qt.textContent=q.q; card.appendChild(qt);
    const os=document.createElement('div'); os.className='opts';
    q.options.forEach((o,k)=>{const lab=document.createElement('label'); lab.className='opt';
      lab.innerHTML='<input type="radio"><span class="l"></span><span class="t"></span>';
      lab.querySelector('.l').textContent=L[k]; lab.querySelector('.t').textContent=o;
      lab.onclick=e=>{e.preventDefault(); if(done)return; ans[qi]=k; paint(card,qi); progress();};
      os.appendChild(lab);});
    card.appendChild(os);
    const ex=document.createElement('div'); ex.className='ex'; card.appendChild(ex);
    list.appendChild(card); paint(card,qi);
  });
}
function paint(card,qi){const q=Q[qi];
  card.querySelectorAll('.opt').forEach((el,k)=>{el.classList.toggle('sel',!done&&ans[qi]===k);
    el.classList.toggle('right',done&&k===q.correct); el.classList.toggle('wrong',done&&ans[qi]===k&&k!==q.correct);});
  card.classList.toggle('done',done);
  const v=card.querySelector('.verdict'), ex=card.querySelector('.ex');
  if(done){const ok=ans[qi]===q.correct; card.classList.toggle('ok',ok); card.classList.toggle('bad',!ok);
    v.className='verdict '+(ok?'ok':'bad'); v.textContent=ok?'✓ Đúng':(ans[qi]===undefined?'✗ Chưa làm':'✗ Sai');
    ex.innerHTML=''; const b=document.createElement('b'); b.textContent='Đáp án '+L[q.correct]+'. '; ex.appendChild(b); ex.appendChild(document.createTextNode(q.expl));}
  else{card.classList.remove('ok','bad'); v.textContent='';}
}
function progress(){const n=Object.keys(ans).length; $('#prog').textContent=n+'/'+Q.length+' câu đã chọn'; $('#trk').style.width=(n/Q.length*100)+'%';}
function submit(){done=true; render();
  let ok=0; Q.forEach((q,i)=>{if(ans[i]===q.correct)ok++;});
  const na=Q.length-Object.keys(ans).length, bad=Q.length-ok, pct=Math.round(ok/Q.length*100);
  const r=$('#result'); r.classList.add('show');
  r.innerHTML=`<div class="score"><div class="ring" style="--p:${pct}"><b>${ok}/${Q.length}</b></div><div><div style="font-size:18px;font-weight:700;margin-bottom:6px">${pct>=80?'Rất tốt! 🎉':pct>=50?'Khá ổn, xem lại câu sai nhé':'Cần ôn thêm'}</div><div class="stat"><span class="pill ok">✓ ${ok} đúng</span><span class="pill bad">✗ ${bad} sai</span>${na?`<span class="pill na">${na} câu bỏ trống (tính là sai)</span>`:''}</div></div></div><div class="jump"></div>`;
  const j=r.querySelector('.jump'); order.forEach((qi,pos)=>{const a=document.createElement('a'); a.href='#q'+qi; a.textContent=pos+1; a.className=ans[qi]===Q[qi].correct?'ok':'bad'; j.appendChild(a);});
  $('#submit').hidden=true; $('#shuffle').disabled=true; $('#retry').hidden=false; $('#filter').hidden=false;
  try{const k='mmt-best-'+EXAM; const best=+(localStorage.getItem(k)||-1); if(ok>best)localStorage.setItem(k,ok); localStorage.setItem('mmt-last-'+EXAM,ok);}catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#submit').onclick=()=>{const na=Q.length-Object.keys(ans).length; if(na){$('#mtext').textContent=`Còn ${na} câu chưa chọn đáp án. Vẫn nộp bài?`; $('#modal').classList.add('show');} else submit();};
$('#mno').onclick=()=>$('#modal').classList.remove('show');
$('#myes').onclick=()=>{$('#modal').classList.remove('show'); submit();};
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} render(); window.scrollTo({top:0,behavior:'smooth'});};
$('#retry').onclick=()=>{ans={}; done=false; $('#result').classList.remove('show'); $('#submit').hidden=false; $('#shuffle').disabled=false; $('#retry').hidden=true; $('#filter').hidden=true; $('#list').classList.remove('onlybad'); $('#filter').textContent='Chỉ xem câu sai'; render(); progress(); window.scrollTo({top:0});};
$('#filter').onclick=()=>{const on=$('#list').classList.toggle('onlybad'); $('#filter').textContent=on?'Xem tất cả':'Chỉ xem câu sai';};
$('#theme').onclick=()=>{const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('mmt-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('mmt-theme'); if(t)document.documentElement.dataset.theme=t;}catch(e){}
render(); progress();
</script></body></html>
